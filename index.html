 "A mission explains why the organization exists, who it serves, and what it provides.", "trap": "A mission is a broad purpose; a measurable target specifies an outcome and often a deadline.", "terms": [{"id": "s1t1", "name": "Mission statement", "definition": "A broad declaration of purpose identifying products and customers and distinguishing the organization from competitors.", "example": "A repair shop declares that it exists to keep local families safely mobile through affordable vehicle repairs."}], "guide": "Mission statements", "supp": "", "extra": false, "flow": false}, {"id": "s2", "ch": 6, "title": "Three steps in planning", "source": "3 Steps in Planning; The Nature of the Planning Process", "lead": "Determine the destination, choose a route, and put the route into action.", "trap": "Formulating a strategy chooses the approach; implementing it assigns resources and responsibilities.", "terms": [{"id": "s2t1", "name": "Determine mission and goals", "definition": "Define the business and establish major goals before choosing strategies.", "example": "A retailer first decides whom it serves and sets its major growth goals."}, {"id": "s2t2", "name": "Formulate strategy", "definition": "Analyze the current situation and develop strategies to reach the goals.", "example": "After setting goals, a retailer evaluates rivals and chooses how it will compete."}, {"id": "s2t3", "name": "Implement strategy", "definition": "Allocate resources and responsibilities to carry out the chosen strategy.", "example": "A retailer assigns managers, funding, and deadlines to execute its chosen expansion plan."}], "guide": "Three steps in planning", "supp": "", "extra": false, "flow": true}, {"id": "s3", "ch": 6, "title": "Fayol’s four qualities", "source": "4 Qualities of Effective Plans (Fayol)", "lead": "An effective plan provides a common direction while staying current, evidence based, and adaptable.", "trap": "Continuity means ongoing planning; flexibility means the ability to change a plan.", "terms": [{"id": "s3t1", "name": "Unity", "definition": "One overall plan guides coordinated action toward common goals.", "example": "Every department aligns its activities with one organization-wide plan."}, {"id": "s3t2", "name": "Continuity", "definition": "Planning continues over time rather than ending after the initial plan.", "example": "Managers revisit and update the planning process throughout the year."}, {"id": "s3t3", "name": "Flexibility", "definition": "Plans can change when conditions or needs change.", "example": "A supplier closure leads managers to revise the sourcing plan."}, {"id": "s3t4", "name": "Accuracy", "definition": "Plans use collected information to reflect conditions as accurately as possible.", "example": "Before estimating capacity, managers collect actual production data."}], "guide": "Fayol’s four qualities", "supp": "", "extra": false, "flow": false}, {"id": "s4", "ch": 6, "title": "SWOT analysis", "source": "Formulating a Strategy", "lead": "Separate internal conditions from external conditions, then ask whether each helps or hurts.", "trap": "Strengths and weaknesses are internal. Opportunities and threats are external.", "terms": [{"id": "s4t1", "name": "Strength", "definition": "An internal organizational capability or advantage.", "example": "A company identifies its highly skilled in-house engineering team as an advantage."}, {"id": "s4t2", "name": "Weakness", "definition": "An internal organizational limitation or disadvantage.", "example": "A company identifies its own outdated machinery as a disadvantage."}, {"id": "s4t3", "name": "Opportunity", "definition": "An external condition the organization could use to its advantage.", "example": "Growing demand in a previously unserved region creates a chance to expand."}, {"id": "s4t4", "name": "Threat", "definition": "An external condition that could harm the organization.", "example": "A new rival enters the market and competes for the company’s customers."}], "guide": "SWOT analysis", "supp": "", "extra": false, "flow": false}, {"id": "s5", "ch": 6, "title": "Business-level strategies", "source": "Business Level Strategies", "lead": "Low cost focuses on the cost of operating. Differentiation focuses on valued differences.", "trap": "A low selling price alone does not establish a low-cost strategy. Look for costs below rivals.", "terms": [{"id": "s5t1", "name": "Low-cost strategy", "definition": "Drive total organizational costs below competitors’ total costs.", "example": "A manufacturer standardizes production and reduces waste to operate at a lower total cost than rivals."}, {"id": "s5t2", "name": "Differentiation strategy", "definition": "Distinguish products through features such as design, quality, or after-sales service.", "example": "A manufacturer competes through distinctive design and exceptional after-sales support."}], "guide": "Business-level strategies", "supp": "", "extra": false, "flow": false}, {"id": "s6", "ch": 7, "title": "Job design", "source": "Job Design", "lead": "Managers choose how tasks fit into jobs and how much responsibility each worker has.", "trap": "Enlargement adds different tasks; enrichment adds responsibility and control.", "terms": [{"id": "s6t1", "name": "Job design", "definition": "Decide how to divide tasks into specific jobs.", "example": "A manager decides which tasks belong in each position on a new service team."}, {"id": "s6t2", "name": "Job simplification", "definition": "Reduce the number of tasks each worker performs.", "example": "An employee who handled five assembly tasks now performs just one repeatedly."}, {"id": "s6t3", "name": "Job enlargement", "definition": "Increase the number of different tasks within a job.", "example": "A receptionist adds filing and scheduling duties but receives no additional decision authority."}, {"id": "s6t4", "name": "Job enrichment", "definition": "Increase a worker’s responsibility over the job.", "example": "A technician gains authority to plan work and make quality decisions instead of waiting for approval."}], "guide": "Job design", "supp": "", "extra": false, "flow": false}, {"id": "s7", "ch": 7, "title": "Job Characteristics Model", "source": "Job Characteristics Model (embedded table)", "lead": "Five characteristics describe how a job is experienced by the person doing it.", "trap": "Task identity concerns completing a whole piece of work; significance concerns its importance.", "terms": [{"id": "s7t1", "name": "Skill variety", "definition": "The job uses a range of the employee’s skills.", "example": "One employee uses writing, analysis, and design skills in the same job."}, {"id": "s7t2", "name": "Task identity", "definition": "The worker completes an identifiable whole piece of work from beginning to end.", "example": "A craftsperson makes an entire chair instead of only attaching one leg."}, {"id": "s7t3", "name": "Task significance", "definition": "The worker sees the task as meaningful to the organization.", "example": "A worker understands that a safety inspection is essential to the organization’s safe operation."}, {"id": "s7t4", "name": "Autonomy", "definition": "The employee has freedom to schedule and carry out tasks.", "example": "A designer chooses when and how to complete an assigned project."}, {"id": "s7t5", "name": "Feedback", "definition": "The worker receives direct information about how well the job is done.", "example": "A technician’s test results immediately show whether each repair succeeded."}], "guide": "Job Characteristics Model", "supp": "", "extra": false, "flow": false}, {"id": "s8", "ch": 7, "title": "Divisional structures", "source": "Divisional Structure; 3 types of Divisional Structure", "lead": "Divisions bring functions together around a product, region, or customer market.", "trap": "Geographic divisions organize by location; market divisions organize by customer needs or type.", "terms": [{"id": "s8t1", "name": "Product structure", "definition": "Organize divisions around particular products, allowing specialized expertise.", "example": "A company has separate appliance, furniture, and electronics divisions."}, {"id": "s8t2", "name": "Geographic structure", "definition": "Organize divisions around regions or countries with different customer needs.", "example": "A company creates North America, Europe, and Asia divisions."}, {"id": "s8t3", "name": "Market structure", "definition": "Organize divisions around customer groups so managers can respond to their needs.", "example": "A bank has separate divisions for individual customers and business customers."}], "guide": "Divisional structures", "supp": "", "extra": false, "flow": false}, {"id": "s9", "ch": 7, "title": "Matrix versus product teams", "source": "Matrix and Product Team Designs", "lead": "Check how many managers an employee reports to and whether the team assignment is permanent.", "trap": "Both can connect functions. Dual reporting distinguishes the matrix structure.", "terms": [{"id": "s9t1", "name": "Matrix structure", "definition": "Group employees by function and product simultaneously, with two reporting relationships and reassignment as needs change.", "example": "An engineer reports both to the engineering manager and a product manager."}, {"id": "s9t2", "name": "Product team structure", "definition": "Permanently assign employees to a cross-functional team reporting only to the product team manager.", "example": "A marketer joins a permanent product team and reports only to that team’s manager."}], "guide": "Matrix versus product teams", "supp": "", "extra": false, "flow": false}, {"id": "s10", "ch": 7, "title": "Integrating mechanisms", "source": "Coordinating Functions and Divisions; Types of Integrating Mechanisms", "lead": "These mechanisms help functions coordinate without sending every disagreement up to the CEO.", "trap": "A task force is temporary; a cross-functional team is permanent in this course’s comparison.", "terms": [{"id": "s10t1", "name": "Liaison role", "definition": "A manager coordinates directly with a manager in another function.", "example": "A marketing manager regularly coordinates a shared issue with the research manager."}, {"id": "s10t2", "name": "Task force", "definition": "A temporary committee brings people from multiple functions together to solve a specific problem.", "example": "Representatives form an ad hoc committee to resolve a launch problem, then disband."}, {"id": "s10t3", "name": "Cross-functional team", "definition": "A permanent team brings different functions together for ongoing work.", "example": "Research, marketing, and production representatives work together permanently on a product."}, {"id": "s10t4", "name": "Integrating role", "definition": "A role dedicated to coordinating and integrating activities across functions or divisions.", "example": "A senior manager’s primary responsibility is to improve coordination among several divisions."}], "guide": "Integrating mechanisms", "supp": "", "extra": false, "flow": false}, {"id": "s11", "ch": 7, "title": "Strategic alliances", "source": "Strategic Alliance", "lead": "Companies can coordinate resources through a formal agreement while remaining separate organizations.", "trap": "An alliance is an agreement between companies; an internal team connects people within an organization.", "terms": [{"id": "s11t1", "name": "Strategic alliance", "definition": "A formal agreement between two or more companies to share or exchange resources to produce and market a product.", "example": "Two companies formally agree to share technology and distribution resources for a new product."}], "guide": "Strategic alliances", "supp": "", "extra": false, "flow": false}, {"id": "s12", "ch": 8, "title": "Good control systems", "source": "Control Systems", "lead": "Useful control information is accurate, timely, and flexible enough to support a response.", "trap": "Control should help managers respond, not merely accumulate reports.", "terms": [{"id": "s12t1", "name": "Flexible control system", "definition": "A control system can adapt so managers can respond as needed.", "example": "Managers revise the measures when the production process changes."}, {"id": "s12t2", "name": "Accurate control information", "definition": "Control reports correctly represent organizational performance.", "example": "Managers verify reported output against actual production records."}, {"id": "s12t3", "name": "Timely control information", "definition": "Information arrives soon enough for managers to act on it.", "example": "A live error alert reaches a supervisor while the problem can still be corrected."}], "guide": "Good control systems", "supp": "", "extra": false, "flow": false}, {"id": "s13", "ch": 8, "title": "Three control stages", "source": "3 Types of Control Stages (diagram)", "lead": "The stage tells you when control happens: before, during, or after conversion.", "trap": "Feedback control is an output-stage control. “Output control” is also the name of a broader control system; do not merge the two classifications.", "terms": [{"id": "s13t1", "name": "Feedforward control", "definition": "Anticipate and prevent problems at the input stage before they occur.", "example": "A factory checks incoming materials before production begins."}, {"id": "s13t2", "name": "Concurrent control", "definition": "Manage problems during the conversion process as they occur.", "example": "A supervisor corrects a machine setting while production is running."}, {"id": "s13t3", "name": "Feedback control", "definition": "Manage problems after they have arisen by reviewing outputs.", "example": "A manager reviews completed customer orders to identify errors and improve later work."}], "guide": "Three control stages", "supp": "", "extra": false, "flow": true}, {"id": "s14", "ch": 8, "title": "Four steps in control", "source": "Four Steps in Organizational Control (diagram)", "lead": "Set standards, measure, compare, and respond.", "trap": "Measuring performance collects the result; comparing determines whether it meets the standard.", "terms": [{"id": "s14t1", "name": "Establish standards", "definition": "Set performance goals or targets against which performance will be evaluated.", "example": "A manager sets a target of processing 95 orders correctly per day before work begins."}, {"id": "s14t2", "name": "Measure performance", "definition": "Determine actual performance.", "example": "A manager records how many orders employees actually processed correctly."}, {"id": "s14t3", "name": "Compare with standards", "definition": "Compare actual performance with the chosen goals or targets.", "example": "A manager checks whether 88 correct orders meets the target of 95."}, {"id": "s14t4", "name": "Evaluate and correct", "definition": "Evaluate results and take corrective action when standards are not achieved.", "example": "After finding a shortfall, a manager changes the workflow to improve performance."}], "guide": "Four steps in control", "supp": "", "extra": false, "flow": true}, {"id": "s15", "ch": 8, "title": "Three control systems", "source": "3 Organizational Control Systems — Output, Behavior, Culture/Clan", "lead": "Systems differ in what guides performance: results, actions, or shared values.", "trap": "These are types of systems, not a before/during/after sequence.", "terms": [{"id": "s15t1", "name": "Output control", "definition": "Use financial performance, organizational goals, and operating budgets to evaluate results.", "example": "A division is evaluated through profit measures, performance goals, and its operating budget."}, {"id": "s15t2", "name": "Behavior control", "definition": "Guide actions through direct supervision, management by objectives, and rules or standard operating procedures.", "example": "A supervisor observes work and uses agreed objectives and required procedures to guide employees’ actions."}, {"id": "s15t3", "name": "Culture/clan control", "definition": "Employees internalize shared values and norms that guide their decisions through socialization.", "example": "Employees follow a shared service ethic even when no manager is watching and no written rule covers the situation."}], "guide": "Three control systems", "supp": "", "extra": false, "flow": false}, {"id": "s16", "ch": 8, "title": "Adaptive versus inert cultures", "source": "3 Organizational Control Systems — Culture/Clan Control", "lead": "Culture can support learning and commitment or allow poor relationships and minimal effort to persist.", "trap": "An adaptive culture supports employees and long-term growth; it does not simply change rules frequently.", "terms": [{"id": "s16t1", "name": "Adaptive culture", "definition": "Invest in employees, support learning and empowerment, and link rewards to company performance.", "example": "A company invests in training, supports employees, and rewards their contribution to long-term company success."}, {"id": "s16t2", "name": "Inert culture", "definition": "Poor relationships and weak incentives encourage stagnation, noncooperation, and minimal effort.", "example": "Employees avoid helping one another and see no reason to contribute beyond the minimum."}], "guide": "Adaptive versus inert cultures", "supp": "", "extra": false, "flow": false}, {"id": "s17", "ch": 8, "title": "Control and change", "source": "Organizational Control and Change (diagram)", "lead": "Managers balance improving current operations with responding to new, unanticipated events.", "trap": "Consistent control should not prevent needed organizational change.", "terms": [{"id": "s17t1", "name": "Control–change balance", "definition": "Balance improving how the organization currently operates with changing in response to new events.", "example": "A company tightens an existing process while also adapting its business to a newly emerging customer need."}], "guide": "Control and change", "supp": "", "extra": false, "flow": false}, {"id": "s18", "ch": 9, "title": "What motivation means", "source": "What is Motivation?", "lead": "Motivation concerns the direction, effort, and persistence of behavior.", "trap": "Performance also depends on factors beyond motivation; effort alone is not the whole definition.", "terms": [{"id": "s18t1", "name": "Motivation", "definition": "Psychological forces determining what a person does, how hard they try, and how long they persist.", "example": "A researcher chooses a difficult project, works hard on it, and keeps trying after setbacks."}], "guide": "What motivation means", "supp": "", "extra": false, "flow": false}, {"id": "s19", "ch": 9, "title": "Intrinsic versus extrinsic", "source": "What is Motivation?", "lead": "Ask what makes the person perform the behavior.", "trap": "Enjoying the activity itself differs from doing it for a separate reward or to avoid punishment.", "terms": [{"id": "s19t1", "name": "Intrinsic motivation", "definition": "Perform a behavior for its own sake.", "example": "An analyst solves a difficult puzzle because the problem itself is enjoyable."}, {"id": "s19t2", "name": "Extrinsic motivation", "definition": "Perform a behavior for material or social rewards, or to avoid punishment.", "example": "An analyst takes an assignment specifically to earn a bonus."}], "guide": "Intrinsic versus extrinsic", "supp": "", "extra": false, "flow": false}, {"id": "s20", "ch": 9, "title": "Expectancy theory", "source": "Expectancy Theory (two diagrams)", "lead": "Effort connects to performance, performance to outcomes, and outcomes to personal value.", "trap": "Expectancy asks “Can I perform?” Instrumentality asks “Will performance lead to the outcome?” Valence asks “Do I want it?”", "terms": [{"id": "s20t1", "name": "Expectancy", "definition": "The belief that effort can produce a certain level of performance.", "example": "An employee doubts that trying harder will improve performance because they lack training."}, {"id": "s20t2", "name": "Instrumentality", "definition": "The belief that a certain performance level will lead to particular outcomes.", "example": "An employee can meet the target but doubts that management will actually deliver the promised bonus."}, {"id": "s20t3", "name": "Valence", "definition": "How desirable an available outcome is to the individual.", "example": "An employee believes the bonus will be paid but places little value on that particular reward."}], "guide": "Expectancy theory", "supp": "", "extra": false, "flow": true}, {"id": "s21", "ch": 9, "title": "Equity theory", "source": "Equity Theory", "lead": "People judge the fairness of their outcomes relative to inputs through social comparisons.", "trap": "Equal rewards do not automatically feel equitable if people believe their contributions differ.", "terms": [{"id": "s21t1", "name": "Equity theory", "definition": "Motivation depends on perceived fairness of outcomes relative to inputs, often compared with another person.", "example": "A worker compares their pay relative to effort with a coworker’s pay relative to effort and feels unfairly treated."}], "guide": "Equity theory and justice", "supp": "", "extra": false, "flow": false}, {"id": "s22", "ch": 9, "title": "Four forms of justice", "source": "Equity Theory", "lead": "Fairness can concern the outcome, the procedure, respectful treatment, or the explanation.", "trap": "Distributive justice is about what is allocated; procedural justice is about how the decision is made.", "terms": [{"id": "s22t1", "name": "Distributive justice", "definition": "Perceived fairness of the allocation of outcomes such as pay or promotions.", "example": "A worker questions whether the size of their bonus fairly reflects their contribution."}, {"id": "s22t2", "name": "Procedural justice", "definition": "Perceived fairness of the process used to make decisions.", "example": "A worker questions whether the same promotion criteria were consistently applied to everyone."}, {"id": "s22t3", "name": "Interpersonal justice", "definition": "Whether people receive dignified and respectful treatment.", "example": "A manager discusses an unpopular decision respectfully without insulting the employee."}, {"id": "s22t4", "name": "Informational justice", "definition": "Whether people receive candid, adequate, and timely explanations for decisions.", "example": "A manager clearly explains why a decision was made and provides the relevant details promptly."}], "guide": "Equity theory and justice", "supp": "The lecture lists the four justice terms without defining each. Definitions here are supplemental.", "extra": false, "flow": false}, {"id": "s23", "ch": 9, "title": "Operant conditioning", "source": "Operant Conditioning Theory", "lead": "Consequences influence whether behavior becomes more or less likely.", "trap": "Negative reinforcement removes something unpleasant to strengthen a desired behavior. Punishment applies an undesired consequence after dysfunctional behavior.", "terms": [{"id": "s23t1", "name": "Positive reinforcement", "definition": "Provide a desired outcome after functional behavior to encourage it.", "example": "A supervisor gives praise after an employee consistently follows a safe procedure."}, {"id": "s23t2", "name": "Negative reinforcement", "definition": "Remove an undesired outcome after functional behavior to encourage it.", "example": "A supervisor stops unpleasant daily reminders once an employee consistently submits reports on time."}, {"id": "s23t3", "name": "Punishment", "definition": "Apply an undesired consequence when dysfunctional behavior occurs.", "example": "An employee receives a formal reprimand after deliberately violating a safety rule."}, {"id": "s23t4", "name": "Extinction", "definition": "Stop reinforcing a dysfunctional behavior so it decreases.", "example": "Coworkers stop giving attention to disruptive jokes that had been encouraged by their laughter."}], "guide": "Operant conditioning", "supp": "", "extra": false, "flow": false}, {"id": "s24", "ch": 9, "title": "Herzberg’s two categories", "source": "Herzberg’s Motivator-Hygiene Theory", "lead": "Separate the nature of the work from the context in which it is performed.", "trap": "The lecture associates high motivation and satisfaction with meeting motivator needs, not simply improving the work context.", "terms": [{"id": "s24t1", "name": "Motivator needs", "definition": "Needs related to the work itself and how challenging it is.", "example": "An employee seeks more challenging assignments that make the work itself engaging."}, {"id": "s24t2", "name": "Hygiene needs", "definition": "Needs related to the physical and psychological context of work.", "example": "An employee wants a more comfortable and supportive working environment."}], "guide": "Herzberg’s two categories", "supp": "", "extra": false, "flow": false}, {"id": "s25", "ch": 9, "title": "McClelland’s three needs", "source": "McClelland’s", "lead": "Different people place different importance on accomplishment, relationships, and influence.", "trap": "Power concerns influence; achievement concerns meeting demanding standards.", "terms": [{"id": "s25t1", "name": "Need for achievement", "definition": "Desire to perform challenging tasks well and meet personal standards for excellence.", "example": "An employee volunteers for a demanding assignment to test their abilities against a high standard."}, {"id": "s25t2", "name": "Need for affiliation", "definition": "Concern for good interpersonal relationships, being liked, and helping people get along.", "example": "An employee prioritizes maintaining friendly relationships and harmony among coworkers."}, {"id": "s25t3", "name": "Need for power", "definition": "Desire to control or influence others.", "example": "An employee seeks responsibilities that allow them to influence the team’s decisions."}], "guide": "McClelland’s three needs", "supp": "", "extra": false, "flow": false}, {"id": "s26", "ch": 10, "title": "Leadership", "source": "The Nature of Leadership", "lead": "Leadership influences people and directs their efforts toward shared goals.", "trap": "Holding a managerial title and exercising effective leadership are different things.", "terms": [{"id": "s26t1", "name": "Leadership", "definition": "Influence, inspire, motivate, and direct others’ activities to help achieve group or organizational goals.", "example": "A coordinator inspires colleagues to commit their effort to a shared organizational goal."}], "guide": "Leadership", "supp": "", "extra": false, "flow": false}, {"id": "s27", "ch": 10, "title": "Five sources of power", "source": "Power: The Key to Leadership", "lead": "Power can come from a position, control of outcomes, expertise, or others’ admiration.", "trap": "Expert power comes from knowledge; referent power comes from respect, admiration, and loyalty.", "terms": [{"id": "s27t1", "name": "Legitimate power", "definition": "Authority arising from a position in the organizational hierarchy.", "example": "Employees accept a manager’s task assignment because the role gives that manager formal authority."}, {"id": "s27t2", "name": "Reward power", "definition": "Ability to give or withhold tangible or intangible rewards.", "example": "A manager influences behavior by controlling who receives desirable assignments and bonuses."}, {"id": "s27t3", "name": "Coercive power", "definition": "Ability to punish others.", "example": "A manager influences employees through the ability to impose disciplinary consequences."}, {"id": "s27t4", "name": "Expert power", "definition": "Influence based on special knowledge, skills, or expertise.", "example": "Colleagues follow a technician’s advice because of the technician’s specialized knowledge."}, {"id": "s27t5", "name": "Referent power", "definition": "Influence arising from others’ respect, admiration, and loyalty.", "example": "Employees follow a leader because they admire the person and feel loyal to them."}], "guide": "Five sources of power", "supp": "", "extra": false, "flow": false}, {"id": "s28", "ch": 10, "title": "Empowerment", "source": "Empowerment", "lead": "Give employees authority to decide and responsibility for the outcomes.", "trap": "Delegating a task without decision authority does not fully capture empowerment.", "terms": [{"id": "s28t1", "name": "Empowerment", "definition": "Give employees authority to make decisions and responsibility for outcomes, quality, and costs.", "example": "Frontline staff can resolve customer issues directly and are responsible for the results of their decisions."}], "guide": "Empowerment", "supp": "", "extra": false, "flow": false}, {"id": "s29", "ch": 10, "title": "Fiedler’s contingency model", "source": "Contingency Models of Leadership; Fiedler’s Contingency Model", "lead": "Effectiveness depends on the fit between the leader and the situation. Fiedler treats style as enduring.", "trap": "The supplied diagram places task-oriented leaders at very favorable and very unfavorable conditions, and relationship-oriented leaders at intermediate conditions. Preserve the course diagram when studying.", "terms": [{"id": "s29t1", "name": "Relationship-oriented leader", "definition": "Primarily seeks good relations with subordinates and to be liked by them.", "example": "A leader’s enduring priority is building good relationships with the people they supervise."}, {"id": "s29t2", "name": "Task-oriented leader", "definition": "Primarily focuses on task accomplishment and high subordinate performance.", "example": "A leader’s enduring priority is getting assigned tasks completed at a high level."}, {"id": "s29t3", "name": "Leader–member relations", "definition": "The extent to which followers like, trust, and are loyal to the leader.", "example": "A manager assesses whether team members trust and support them."}, {"id": "s29t4", "name": "Task structure", "definition": "How clear-cut the work is, including what to accomplish and how to do it.", "example": "A manager assesses whether the team’s tasks have clear steps and requirements."}, {"id": "s29t5", "name": "Position power", "definition": "Legitimate, reward, and coercive power that comes with the leader’s position.", "example": "A manager assesses the formal authority the role grants to reward or discipline staff."}], "guide": "Contingency models of leadership", "supp": "", "extra": false, "flow": false}, {"id": "s30", "ch": 10, "title": "House’s path-goal theory", "source": "House’s Path-Goal Theory; 4 Kinds of Leadership Behaviors", "lead": "Identify desired outcomes, reward high performance with those outcomes, and clarify the path to goals.", "trap": "Path-goal theory selects behavior to suit workers and their tasks; Fiedler’s model treats style as enduring.", "terms": [{"id": "s30t1", "name": "Directive behavior", "definition": "Set goals, assign tasks, show how to complete work, and take concrete steps to improve performance.", "example": "A leader gives detailed task instructions to employees who are unsure how to proceed."}, {"id": "s30t2", "name": "Supportive behavior", "definition": "Express concern for subordinates and look out for their best interests.", "example": "A leader responds to stressful work by showing concern for employees’ well-being."}, {"id": "s30t3", "name": "Participative behavior", "definition": "Give subordinates a say in matters affecting them.", "example": "A leader invites employees to help decide how their work should be organized."}, {"id": "s30t4", "name": "Achievement-oriented behavior", "definition": "Set very challenging goals and express belief in employees’ abilities.", "example": "A leader sets a demanding target and tells capable workers they can achieve it."}], "guide": "Contingency models of leadership", "supp": "", "extra": false, "flow": false}, {"id": "s31", "ch": 10, "title": "Charismatic leadership", "source": "Transformational Leadership", "lead": "An enthusiastic, self-confident leader communicates a compelling vision of how good things could be.", "trap": "Charisma describes a leader’s vision and influence; it is not simply authority from a job title.", "terms": [{"id": "s31t1", "name": "Charismatic leader", "definition": "An enthusiastic, self-confident transformational leader who clearly communicates an inspiring vision.", "example": "A self-confident leader vividly communicates a better future and generates enthusiasm for that vision."}], "guide": "Charismatic leadership", "supp": "", "extra": false, "flow": false}, {"id": "s32", "ch": 10, "title": "Transactional and transformational", "source": "Transformational Leadership", "lead": "One emphasizes an exchange for performance; the other raises awareness, growth, and commitment to the organization.", "trap": "Transformational leadership asks followers to work beyond personal self-interest, not merely for an agreed reward.", "terms": [{"id": "s32t1", "name": "Transactional leadership", "definition": "Guide task accomplishment through an exchange, such as a reward for desired performance.", "example": "A leader offers an agreed incentive in return for meeting a specified performance target."}, {"id": "s32t2", "name": "Transformational leadership", "definition": "Show the importance of work, encourage personal growth, and motivate people to act for the organization’s good.", "example": "A leader connects employees’ jobs to the larger mission and inspires them to grow and serve the organization beyond personal gain."}], "guide": "Transactional and transformational", "supp": "Transactional leadership is listed in the guide but not explicitly defined in the deck. Its definition is supplemental (OpenStax).", "extra": false, "flow": false}, {"id": "s33", "ch": 11, "title": "Groups versus teams", "source": "Groups and Teams", "lead": "A team is a group whose members work intensely together toward a specific common goal.", "trap": "Every team is a group, but the general definition of a group does not require the same intensity of joint work.", "terms": [{"id": "s33t1", "name": "Group", "definition": "Two or more people who interact to accomplish certain goals or meet certain needs.", "example": "Coworkers meet informally to satisfy their need for social contact, without jointly producing a specific project."}, {"id": "s33t2", "name": "Team", "definition": "A group whose members work intensely together to achieve a specific common goal or objective.", "example": "Designers and engineers work closely and interdependently every day to deliver one shared product launch."}], "guide": "Groups versus teams", "supp": "", "extra": false, "flow": false}, {"id": "s34", "ch": 11, "title": "Synergy", "source": "Synergy", "lead": "Coordinating contributions can produce performance gains beyond isolated work.", "trap": "Simply putting people together does not guarantee synergy; the gain comes from coordinating contributions.", "terms": [{"id": "s34t1", "name": "Synergy", "definition": "Performance gains from coordinated action, including sharing ideas, correcting errors, and combining knowledge.", "example": "A designer and engineer combine knowledge and catch each other’s errors to solve a problem neither could solve alone."}], "guide": "Synergy", "supp": "", "extra": false, "flow": false}, {"id": "s35", "ch": 11, "title": "Group development", "source": "Stages of Group Development (diagram)", "lead": "Remember the order: forming, storming, norming, performing, adjourning.", "trap": "Storming precedes norming; adjourning follows performing.", "terms": [{"id": "s35t1", "name": "Forming", "definition": "Members begin coming together and orienting to the group.", "example": "A new project group meets for the first time and explores its purpose."}, {"id": "s35t2", "name": "Storming", "definition": "Members experience conflict over roles, approaches, or influence.", "example": "Group members disagree over who should lead and how work should be divided."}, {"id": "s35t3", "name": "Norming", "definition": "Members develop shared expectations and workable relationships.", "example": "After disagreements, members agree on how they will work together."}, {"id": "s35t4", "name": "Performing", "definition": "Members focus effectively on accomplishing the group’s work.", "example": "An established team coordinates smoothly and concentrates on delivering its project."}, {"id": "s35t5", "name": "Adjourning", "definition": "The group concludes its work and disbands or closes the activity.", "example": "After completing a temporary project, members wrap up and leave the team."}], "guide": "Group development", "supp": "The lecture diagram supplies the sequence. Brief descriptions of each stage are supplemental.", "extra": false, "flow": true}, {"id": "s36", "ch": 11, "title": "Group size", "source": "Group Size", "lead": "The lecture describes small groups as 2–9 members, ideally 5–8, with easier coordination and stronger involvement.", "trap": "This is the course’s guidance, not a universal rule for every task. Larger groups may offer resources but make coordination harder.", "terms": [{"id": "s36t1", "name": "Small-group advantages", "definition": "Smaller groups often interact more, coordinate more easily, share information, and recognize individual contributions.", "example": "A six-person group finds it easy for everyone to exchange information and see how their contributions matter."}], "guide": "Group size", "supp": "", "extra": false, "flow": false}, {"id": "s37", "ch": 11, "title": "Reducing social loafing", "source": "Managing Groups and Teams for High Performance (diagram)", "lead": "Social loafing means contributing less effort in a group than when working alone.", "trap": "More people do not automatically create more useful effort. Make individual contributions visible and valuable.", "terms": [{"id": "s37t1", "name": "Identify individual contributions", "definition": "Make each person’s contribution identifiable when possible.", "example": "A project team records which member completed each part so individual effort is visible."}, {"id": "s37t2", "name": "Emphasize contribution value", "definition": "Show members why their individual contributions matter to group success.", "example": "A leader explains how each person’s work is essential to the group’s outcome."}, {"id": "s37t3", "name": "Keep group size appropriate", "definition": "Use a suitable group size rather than adding unnecessary members.", "example": "A manager limits a team to the people actually needed for the task to discourage hidden low effort."}], "guide": "Reducing social loafing", "supp": "", "extra": false, "flow": false}, {"id": "s38", "ch": 12, "title": "Competitive advantage", "source": "Week 7: What is Organizational Control?; Week 9 study-guide scope", "lead": "Use efficiency, quality, responsiveness to customers, and innovation as four lenses on performance.", "trap": "These four are named in the Week 7 deck even though the guide lists them under Week 9.", "terms": [{"id": "s38t1", "name": "Efficiency", "definition": "Use resources productively and reduce unnecessary inputs or waste.", "example": "A service center handles the same workload with fewer wasted staff hours."}, {"id": "s38t2", "name": "Quality", "definition": "Provide goods or services that perform well and meet expected standards.", "example": "A manufacturer improves reliability and reduces product defects."}, {"id": "s38t3", "name": "Responsiveness to customers", "definition": "Meet customers’ needs promptly and effectively.", "example": "A service team adapts its response to customer needs and shortens response times."}, {"id": "s38t4", "name": "Innovation", "definition": "Introduce new or improved products or ways of operating.", "example": "A company develops a new service and a new way to deliver it."}], "guide": "Competitive advantage", "supp": "The lecture names the four building blocks. Short explanatory definitions are supplemental.", "extra": false, "flow": false}, {"id": "s39", "ch": 12, "title": "Recruitment versus selection", "source": "Recruitment & Selection", "lead": "Recruitment develops the candidate pool. Selection evaluates candidates for the job.", "trap": "Recruitment attracts applicants; selection determines their relative qualifications and potential.", "terms": [{"id": "s39t1", "name": "Recruitment", "definition": "Develop a pool of qualified candidates for open positions.", "example": "An employer runs a campus recruiting event to attract qualified applicants."}, {"id": "s39t2", "name": "Selection", "definition": "Determine applicants’ relative qualifications and potential for performing well in a job.", "example": "Managers compare applicants’ interviews and work samples to decide who fits the position."}], "guide": "Recruitment versus selection", "supp": "", "extra": false, "flow": false}, {"id": "s40", "ch": 12, "title": "Training versus development", "source": "Training & Development (diagram)", "lead": "Training targets job skills; development builds broader capability for growth and future responsibilities.", "trap": "Both can use classroom and on-the-job learning. The distinction is their focus, not simply where learning occurs.", "terms": [{"id": "s40t1", "name": "Training", "definition": "Build the knowledge and skills needed to perform a job, using methods such as instruction, on-the-job practice, or apprenticeships.", "example": "A new employee practices the procedures needed to operate equipment in their current job."}, {"id": "s40t2", "name": "Development", "definition": "Broaden employees’ capabilities for growth and future responsibilities through learning and varied work experiences.", "example": "A potential future manager rotates through different functions and pursues further education."}], "guide": "Training versus development", "supp": "The lecture diagram lists learning methods. The distinction between current-job training and broader development is supplemental (OpenStax).", "extra": false, "flow": false}, {"id": "s41", "ch": 12, "title": "Outsourcing", "source": "Human Resource Planning; Week 6: Strategic Alliance", "lead": "An organization can use outside providers instead of performing all work internally.", "trap": "Outsourcing concerns an outside provider, not merely assigning work to a different internal department.", "terms": [{"id": "s41t1", "name": "Outsourcing", "definition": "Use outside suppliers, manufacturers, or contract workers to provide goods or services.", "example": "A company hires an external provider to operate its payroll service instead of staffing that function internally."}], "guide": "Outsourcing", "supp": "", "extra": false, "flow": false}, {"id": "s42", "ch": 12, "title": "Reliability", "source": "Reliability and Validity", "lead": "Reliability asks whether a tool measures consistently each time it is used.", "trap": "Consistency does not prove that the tool measures the intended characteristic.", "terms": [{"id": "s42t1", "name": "Reliability", "definition": "The degree to which a tool or test measures the same thing consistently each time it is used.", "example": "An assessment produces consistent results on repeated use under comparable conditions."}], "guide": "Reliability", "supp": "", "extra": false, "flow": false}, {"id": "s43", "ch": 12, "title": "Validity", "source": "Reliability and Validity", "lead": "Validity asks whether the tool measures what it is supposed to measure.", "trap": "A consistent test of the wrong characteristic can be reliable without being valid for a hiring purpose.", "terms": [{"id": "s43t1", "name": "Validity", "definition": "The degree to which a tool or test measures what it is intended to measure.", "example": "A selection exercise actually measures the job skill it was designed to assess."}], "guide": "Validity", "supp": "", "extra": false, "flow": false}, {"id": "s44", "ch": 12, "title": "Effective feedback: the conversation", "source": "Effective Feedback Tips", "lead": "Focus feedback on improvement that the employee can act on.", "trap": "Personal criticism targets the person; useful feedback identifies correctable behaviors or outcomes.", "terms": [{"id": "s44t1", "name": "Specific, correctable feedback", "definition": "Describe behaviors or outcomes within the worker’s ability to improve.", "example": "A supervisor identifies errors in a report and explains exactly which reporting behaviors can be improved."}, {"id": "s44t2", "name": "Problem-solving approach", "definition": "Treat appraisal as finding solutions rather than criticizing.", "example": "A supervisor and employee jointly investigate an obstacle and work out a practical solution."}, {"id": "s44t3", "name": "Confidence in improvement", "definition": "Express belief in the employee’s ability to improve.", "example": "A manager tells an employee they can improve and supports their effort to do so."}, {"id": "s44t4", "name": "Formal and informal feedback", "definition": "Provide feedback at scheduled appraisals and through ongoing, unscheduled discussions.", "example": "A manager gives regular in-the-moment guidance as well as the annual review."}], "guide": "Effective feedback tips", "supp": "", "extra": false, "flow": false}, {"id": "s45", "ch": 12, "title": "Effective feedback: follow-through", "source": "Effective Feedback Tips", "lead": "Recognize what works, treat people respectfully, and agree on when improvement will happen.", "trap": "Feedback needs a path forward, not just a statement about past performance.", "terms": [{"id": "s45t1", "name": "Praise high performance", "definition": "Recognize specific instances and areas in which the worker excels.", "example": "A supervisor recognizes an employee’s excellent handling of a difficult customer interaction."}, {"id": "s45t2", "name": "Respectful feedback", "definition": "Avoid personal criticisms and treat subordinates with respect.", "example": "A supervisor discusses a mistake without insulting the employee’s character."}, {"id": "s45t3", "name": "Improvement timetable", "definition": "Agree on a timetable for performance improvement.", "example": "A manager and employee agree when improved performance will be demonstrated and reviewed."}], "guide": "Effective feedback tips", "supp": "", "extra": false, "flow": false}], "cards": [{"id": "s1t1", "refs": ["s1"], "ch": 6, "question": "What is a mission statement, and what does it do?", "answer": ["A broad statement of organizational purpose: what it provides, whom it serves, and what distinguishes it from competitors. It gives the organization direction."], "legacy": ["s1t1"], "example": false}, {"id": "planning-order", "refs": ["s2"], "ch": 6, "question": "What are the three steps in planning, in order?", "answer": ["1. Determine the mission and major goals.", "2. Formulate strategy: analyze the situation and choose an approach.", "3. Implement strategy: assign resources and responsibilities."], "legacy": ["s2t1", "s2t2", "s2t3"], "example": false}, {"id": "planning-apply", "refs": ["s2"], "ch": 6, "question": "Choosing how to compete versus assigning budgets and responsibilities: which planning steps are these?", "answer": ["Choosing the approach = formulating strategy.", "Putting it into action with resources and responsibilities = implementing strategy."], "legacy": ["s2t2", "s2t3"], "example": true}, {"id": "fayol", "refs": ["s3"], "ch": 6, "question": "What are Fayol’s four qualities of an effective plan?", "answer": ["Unity: one overall plan.", "Continuity: ongoing planning.", "Flexibility: ability to change.", "Accuracy: use accurate, collected information."], "legacy": ["s3t1", "s3t2", "s3t3", "s3t4"], "example": false}, {"id": "swot", "refs": ["s4"], "ch": 6, "question": "What does SWOT assess, and which factors are internal?", "answer": ["Strengths and weaknesses are internal capabilities or limitations.", "Opportunities and threats are external conditions that could help or hurt the organization."], "legacy": ["s4t1", "s4t2", "s4t3", "s4t4"], "example": false}, {"id": "swot-apply", "refs": ["s4"], "ch": 6, "question": "Classify these: skilled staff, outdated equipment, new market demand, and a new competitor.", "answer": ["Skilled staff: strength.", "Outdated equipment: weakness.", "New market demand: opportunity.", "New competitor: threat."], "legacy": ["s4t1", "s4t2", "s4t3", "s4t4"], "example": true}, {"id": "strategy-compare", "refs": ["s5"], "ch": 6, "question": "How do low-cost and differentiation strategies compete?", "answer": ["Low cost: operate at lower total cost than rivals.", "Differentiation: offer valued differences in design, quality, or service. A low selling price alone does not prove a low-cost strategy."], "legacy": ["s5t1", "s5t2"], "example": false}, {"id": "job-design", "refs": ["s6"], "ch": 7, "question": "What are job design and job simplification?", "answer": ["Job design divides tasks into specific jobs.", "Job simplification reduces the number of tasks each worker performs."], "legacy": ["s6t1", "s6t2"], "example": false}, {"id": "job-expand", "refs": ["s6"], "ch": 7, "question": "Job enlargement versus enrichment: what changes?", "answer": ["Enlargement adds different tasks.", "Enrichment adds responsibility or control over the job. More tasks do not necessarily mean more authority."], "legacy": ["s6t3", "s6t4"], "example": false}, {"id": "job-characteristics", "refs": ["s7"], "ch": 7, "question": "What are the five parts of the Job Characteristics Model?", "answer": ["Skill variety: use a range of skills.", "Task identity: complete a whole piece of work.", "Task significance: do meaningful work.", "Autonomy: choose how to schedule and do the work.", "Feedback: receive information about performance."], "legacy": ["s7t1", "s7t2", "s7t3", "s7t4", "s7t5"], "example": false}, {"id": "identity-significance", "refs": ["s7"], "ch": 7, "question": "How do task identity and task significance differ?", "answer": ["Identity: “Do I complete a whole piece of work?”", "Significance: “Does this work matter?”"], "legacy": ["s7t2", "s7t3"], "example": false}, {"id": "autonomy-feedback", "refs": ["s7"], "ch": 7, "question": "Choosing your own work methods and seeing direct performance results illustrate which characteristics?", "answer": ["Choosing work methods = autonomy.", "Seeing how well the work was done = feedback."], "legacy": ["s7t4", "s7t5"], "example": true}, {"id": "divisions", "refs": ["s8"], "ch": 7, "question": "What are the three divisional structures?", "answer": ["Product: divisions by product line.", "Geographic: divisions by region or country.", "Market: divisions by customer group or needs."], "legacy": ["s8t1", "s8t2", "s8t3"], "example": false}, {"id": "division-apply", "refs": ["s8"], "ch": 7, "question": "A bank separates services for businesses and individuals. How does that differ from regional divisions?", "answer": ["Businesses versus individuals = market structure, based on customer groups.", "Regional divisions = geographic structure, based on location."], "legacy": ["s8t2", "s8t3"], "example": true}, {"id": "matrix-team", "refs": ["s9"], "ch": 7, "question": "How does a matrix differ from a product team structure?", "answer": ["Matrix: simultaneous function and product grouping, two reporting relationships, reassignment as needed.", "Product team: permanent cross-functional assignment, reporting only to the product team manager."], "legacy": ["s9t1", "s9t2"], "example": false}, {"id": "integrating", "refs": ["s10"], "ch": 7, "question": "What are the four integrating mechanisms?", "answer": ["Liaison: a manager coordinates with another function.", "Task force: a temporary committee for a specific issue.", "Cross-functional team: permanent collaboration across functions.", "Integrating role: a position dedicated to coordination."], "legacy": ["s10t1", "s10t2", "s10t3", "s10t4"], "example": false}, {"id": "taskforce-team", "refs": ["s10"], "ch": 7, "question": "A task force versus a cross-functional team: which is temporary?", "answer": ["Task force: temporary; disbands after the specific problem is resolved.", "Cross-functional team: permanent in the lecture’s comparison."], "legacy": ["s10t2", "s10t3"], "example": false}, {"id": "s11t1", "refs": ["s11"], "ch": 7, "question": "What is a strategic alliance?", "answer": ["A formal agreement between two or more companies to share or exchange resources to produce and market a product."], "legacy": ["s11t1"], "example": false}, {"id": "good-control", "refs": ["s12"], "ch": 8, "question": "What makes a good control system?", "answer": ["Flexible: managers can adapt their response.", "Accurate: information reflects actual performance.", "Timely: information arrives soon enough to act."], "legacy": ["s12t1", "s12t2", "s12t3"], "example": false}, {"id": "control-stages", "refs": ["s13"], "ch": 8, "question": "What are the three control stages?", "answer": ["Input / feedforward: anticipate problems before they occur.", "Conversion / concurrent: manage problems as they occur.", "Output / feedback: review results and address problems after they arise."], "legacy": ["s13t1", "s13t2", "s13t3"], "example": false}, {"id": "control-stages-apply", "refs": ["s13"], "ch": 8, "question": "Checking incoming materials, adjusting a running machine, and reviewing completed orders: which controls?", "answer": ["Incoming materials: feedforward.", "Running machine: concurrent.", "Completed orders: feedback."], "legacy": ["s13t1", "s13t2", "s13t3"], "example": true}, {"id": "control-steps", "refs": ["s14"], "ch": 8, "question": "What are the four steps in organizational control?", "answer": ["1. Establish performance standards or targets.", "2. Measure actual performance.", "3. Compare actual performance with standards.", "4. Evaluate results and take corrective action if needed."], "legacy": ["s14t1", "s14t2", "s14t3", "s14t4"], "example": false}, {"id": "control-systems", "refs": ["s15"], "ch": 8, "question": "What are the three organizational control systems?", "answer": ["Output: evaluate results using financial measures, goals, and operating budgets.", "Behavior: guide actions using supervision, objectives, and rules/SOPs.", "Culture/clan: internalized values, norms, and socialization guide decisions."], "legacy": ["s15t1", "s15t2", "s15t3"], "example": false}, {"id": "behavior-mechanisms", "refs": ["s15"], "ch": 8, "question": "How does behavior control guide employees?", "answer": ["Direct supervision: observe, teach, and guide.", "Management by objectives: agree on goals and review performance.", "Rules and SOPs: specify required actions."], "legacy": ["s15t2"], "example": false}, {"id": "control-distinction", "refs": ["s13", "s15"], "ch": 8, "question": "Control stages versus control systems: what is the distinction?", "answer": ["Stages describe WHEN: feedforward, concurrent, feedback.", "Systems describe HOW: output, behavior, culture/clan.", "Feedback is an output-stage control; output control is a broader results-based system."], "legacy": ["s13t1", "s13t2", "s13t3", "s15t1", "s15t2", "s15t3"], "example": false}, {"id": "cultures", "refs": ["s16"], "ch": 8, "question": "How do adaptive and inert cultures differ?", "answer": ["Adaptive: invest in employees, support learning and empowerment, connect rewards to company performance.", "Inert: poor relationships, weak incentives, noncooperation, and minimal effort encourage stagnation."], "legacy": ["s16t1", "s16t2"], "example": false}, {"id": "s17t1", "refs": ["s17"], "ch": 8, "question": "What balance must managers strike between control and change?", "answer": ["Improve current operations while adapting to new, unanticipated events. Control should support performance without blocking needed change."], "legacy": ["s17t1"], "example": false}, {"id": "s18t1", "refs": ["s18"], "ch": 9, "question": "What is motivation?", "answer": ["Psychological forces that determine the direction of behavior, level of effort, and persistence: what someone does, how hard they try, and how long they keep trying."], "legacy": ["s18t1"], "example": false}, {"id": "motivation-compare", "refs": ["s19"], "ch": 9, "question": "Intrinsic versus extrinsic motivation?", "answer": ["Intrinsic: do the activity for its own sake.", "Extrinsic: do it for material/social rewards or to avoid punishment."], "legacy": ["s19t1", "s19t2"], "example": false}, {"id": "expectancy", "refs": ["s20"], "ch": 9, "question": "What are expectancy, instrumentality, and valence?", "answer": ["Expectancy: “Will my effort produce performance?”", "Instrumentality: “Will performance produce the outcome?”", "Valence: “Do I value that outcome?”"], "legacy": ["s20t1", "s20t2", "s20t3"], "example": false}, {"id": "expectancy-apply", "refs": ["s20"], "ch": 9, "question": "An employee can meet the target but doubts the promised bonus will be paid. Which link is weak?", "answer": ["Instrumentality: the performance-to-outcome link.", "Low expectancy would mean doubting their ability to perform. Low valence would mean not wanting the reward."], "legacy": ["s20t1", "s20t2", "s20t3"], "example": true}, {"id": "s21t1", "refs": ["s21"], "ch": 9, "question": "What does equity theory compare?", "answer": ["Perceived outcomes relative to inputs, compared with another person’s outcomes relative to inputs. Motivation depends on perceived fairness, not simply identical rewards."], "legacy": ["s21t1"], "example": false}, {"id": "justice-outcome-process", "refs": ["s22"], "ch": 9, "question": "Distributive versus procedural justice?", "answer": ["Distributive: fairness of the outcomes allocated, such as pay.", "Procedural: fairness of the process used to make the decision."], "legacy": ["s22t1", "s22t2"], "example": false}, {"id": "justice-treatment-info", "refs": ["s22"], "ch": 9, "question": "Interpersonal versus informational justice?", "answer": ["Interpersonal: dignified, respectful treatment.", "Informational: candid, adequate, timely explanations of decisions."], "legacy": ["s22t3", "s22t4"], "example": false}, {"id": "reinforcement", "refs": ["s23"], "ch": 9, "question": "How do positive and negative reinforcement differ?", "answer": ["Both strengthen functional behavior.", "Positive reinforcement adds a desired outcome, such as praise.", "Negative reinforcement removes an undesired outcome, such as unpleasant reminders."], "legacy": ["s23t1", "s23t2"], "example": false}, {"id": "punishment-extinction", "refs": ["s23"], "ch": 9, "question": "How do punishment and extinction differ?", "answer": ["Punishment applies an undesired consequence after dysfunctional behavior.", "Extinction removes whatever was reinforcing that behavior, such as attention for disruptive jokes."], "legacy": ["s23t3", "s23t4"], "example": false}, {"id": "negative-punishment", "refs": ["s23"], "ch": 9, "question": "Stopping reminders after on-time reports versus reprimanding late reports: which is which?", "answer": ["Stopping reminders after desired behavior = negative reinforcement.", "Reprimanding dysfunctional behavior = punishment.", "Negative reinforcement encourages the desired behavior; it is not another name for punishment."], "legacy": ["s23t2", "s23t3"], "example": true}, {"id": "herzberg", "refs": ["s24"], "ch": 9, "question": "What distinguishes Herzberg’s motivator and hygiene needs?", "answer": ["Motivators concern the work itself and its challenge; meeting them supports high motivation and job satisfaction.", "Hygiene needs concern the physical and psychological context of work."], "legacy": ["s24t1", "s24t2"], "example": false}, {"id": "mcclelland", "refs": ["s25"], "ch": 9, "question": "What are McClelland’s three needs?", "answer": ["Achievement: perform challenging tasks well and meet standards of excellence.", "Affiliation: maintain good relationships and be liked.", "Power: control or influence others."], "legacy": ["s25t1", "s25t2", "s25t3"], "example": false}, {"id": "s26t1", "refs": ["s26"], "ch": 10, "question": "What is leadership?", "answer": ["Influencing, inspiring, motivating, and directing people’s activities toward group or organizational goals."], "legacy": ["s26t1"], "example": false}, {"id": "position-powers", "refs": ["s27"], "ch": 10, "question": "What are legitimate, reward, and coercive power?", "answer": ["Legitimate: formal authority from a position.", "Reward: ability to give or withhold rewards.", "Coercive: ability to punish."], "legacy": ["s27t1", "s27t2", "s27t3"], "example": false}, {"id": "personal-powers", "refs": ["s27"], "ch": 10, "question": "Expert versus referent power?", "answer": ["Expert: influence from special knowledge, skills, or expertise.", "Referent: influence from others’ respect, admiration, and loyalty."], "legacy": ["s27t4", "s27t5"], "example": false}, {"id": "s28t1", "refs": ["s28"], "ch": 10, "question": "What is empowerment, and why use it?", "answer": ["Give employees decision authority and responsibility for outcomes.", "It can increase involvement, motivation, and commitment while freeing managers to focus on pressing concerns."], "legacy": ["s28t1"], "example": false}, {"id": "fiedler-styles", "refs": ["s29"], "ch": 10, "question": "What does Fiedler’s contingency model say about leadership style?", "answer": ["Effectiveness depends on fit between leader and situation; style is treated as enduring.", "Relationship-oriented: prioritize good relations.", "Task-oriented: prioritize task accomplishment."], "legacy": ["s29t1", "s29t2"], "example": false}, {"id": "fiedler-situation", "refs": ["s29"], "ch": 10, "question": "Which three situational factors matter in Fiedler’s model?", "answer": ["Leader–member relations: followers’ trust, liking, and loyalty.", "Task structure: how clear-cut the work is.", "Position power: formal legitimate, reward, and coercive power."], "legacy": ["s29t3", "s29t4", "s29t5"], "example": false}, {"id": "fiedler-fit", "refs": ["s29"], "ch": 10, "question": "When does the lecture’s Fiedler diagram favor each leadership style?", "answer": ["Task-oriented: very favorable or very unfavorable situations.", "Relationship-oriented: intermediate situations.", "The course diagram labels the intermediate range IV–VII and the extremes I–III plus VIII."], "legacy": ["s29t1", "s29t2"], "example": false}, {"id": "path-goal", "refs": ["s30"], "ch": 10, "question": "How does House’s path-goal theory motivate people, and what are its four behaviors?", "answer": ["Clarify paths to valued outcomes and reward high performance.", "Directive: give clear task guidance.", "Supportive: show concern for employees.", "Participative: give employees a say.", "Achievement-oriented: set challenging goals and show confidence. Choose behavior to fit employees and their work."], "legacy": ["s30t1", "s30t2", "s30t3", "s30t4"], "example": false}, {"id": "s31t1", "refs": ["s31"], "ch": 10, "question": "What is a charismatic leader?", "answer": ["An enthusiastic, self-confident transformational leader who clearly communicates an inspiring vision of how good things could be."], "legacy": ["s31t1"], "example": false}, {"id": "leadership-compare", "refs": ["s32"], "ch": 10, "question": "Transactional versus transformational leadership?", "answer": ["Transactional: exchange rewards for desired performance.", "Transformational: show work’s importance, support growth, and inspire people to work for the organization beyond personal gain."], "legacy": ["s32t1", "s32t2"], "example": false}, {"id": "leadership-apply", "refs": ["s32"], "ch": 10, "question": "Offering a bonus for a target versus inspiring commitment to a shared mission: which leadership styles?", "answer": ["Bonus-for-performance exchange: transactional.", "Mission, personal growth, and commitment beyond self-interest: transformational."], "legacy": ["s32t1", "s32t2"], "example": true}, {"id": "group-team", "refs": ["s33"], "ch": 11, "question": "How does a team differ from a group?", "answer": ["Group: two or more people interacting to achieve goals or meet needs.", "Team: a group working intensely together toward a specific common goal."], "legacy": ["s33t1", "s33t2"], "example": false}, {"id": "s34t1", "refs": ["s34"], "ch": 11, "question": "What is synergy?", "answer": ["Performance gains from coordinating action: combining knowledge, exchanging ideas, correcting errors, and accomplishing more than people could individually."], "legacy": ["s34t1"], "example": false}, {"id": "group-stages", "refs": ["s35"], "ch": 11, "question": "What are the group development stages, in order?", "answer": ["1. Forming: come together and orient.", "2. Storming: conflict over roles or approaches.", "3. Norming: agree on shared expectations.", "4. Performing: work effectively toward goals.", "5. Adjourning: conclude and disband."], "legacy": ["s35t1", "s35t2", "s35t3", "s35t4", "s35t5"], "example": false}, {"id": "storming-norming", "refs": ["s35"], "ch": 11, "question": "Members argue over roles, then agree on working expectations. Which two stages are these?", "answer": ["Arguing over roles: storming.", "Agreeing on expectations: norming. Norming follows storming."], "legacy": ["s35t2", "s35t3"], "example": true}, {"id": "s36t1", "refs": ["s36"], "ch": 11, "question": "How does group size affect group functioning?", "answer": ["Smaller groups usually coordinate and share information more easily, with stronger motivation, satisfaction, commitment, and visible contributions.", "The lecture describes small groups as 2–9 members, ideally 5–8. This is course guidance, not a universal rule."], "legacy": ["s36t1"], "example": false}, {"id": "loafing-definition", "refs": ["s37"], "ch": 11, "question": "What is social loafing, and why make contributions identifiable?", "answer": ["Social loafing means exerting less effort in a group than alone.", "Making individual contributions identifiable reduces the ability to hide low effort."], "legacy": ["s37t1"], "example": false}, {"id": "loafing-reduce", "refs": ["s37"], "ch": 11, "question": "What are three ways to reduce social loafing?", "answer": ["Make individual contributions identifiable.", "Emphasize the value of each person’s contribution.", "Keep group size appropriate for the task."], "legacy": ["s37t1", "s37t2", "s37t3"], "example": false}, {"id": "advantage", "refs": ["s38"], "ch": 12, "question": "What are the four building blocks of competitive advantage?", "answer": ["Efficiency: use resources productively.", "Quality: meet performance standards and reduce defects.", "Responsiveness to customers: meet customer needs promptly and effectively.", "Innovation: introduce new or improved products or ways of operating."], "legacy": ["s38t1", "s38t2", "s38t3", "s38t4"], "example": false}, {"id": "advantage-apply", "refs": ["s38"], "ch": 12, "question": "Less waste, fewer defects, quicker customer responses, and a new service: match the four building blocks.", "answer": ["Less waste: efficiency.", "Fewer defects: quality.", "Quicker customer responses: responsiveness to customers.", "New service: innovation."], "legacy": ["s38t1", "s38t2", "s38t3", "s38t4"], "example": true}, {"id": "recruit-select", "refs": ["s39"], "ch": 12, "question": "Recruitment versus selection?", "answer": ["Recruitment develops a pool of qualified candidates.", "Selection evaluates applicants’ relative qualifications and potential to perform well in the job."], "legacy": ["s39t1", "s39t2"], "example": false}, {"id": "train-develop", "refs": ["s40"], "ch": 12, "question": "Training versus development?", "answer": ["Training builds skills for the current job, using instruction, on-the-job practice, or apprenticeships.", "Development builds broader capability for growth and future responsibilities through learning and varied experience."], "legacy": ["s40t1", "s40t2"], "example": false}, {"id": "s41t1", "refs": ["s41"], "ch": 12, "question": "What is outsourcing?", "answer": ["Use external suppliers, manufacturers, or contract workers to provide goods or services instead of performing all work internally."], "legacy": ["s41t1"], "example": false}, {"id": "reliability-validity", "refs": ["s42", "s43"], "ch": 12, "question": "Reliability versus validity?", "answer": ["Reliability: does the tool measure consistently?", "Validity: does it measure what it is supposed to?", "A tool can consistently measure the wrong characteristic: reliable, but not valid for the intended purpose."], "legacy": ["s42t1", "s43t1"], "example": false}, {"id": "feedback-conversation", "refs": ["s44"], "ch": 12, "question": "How should a manager approach performance feedback?", "answer": ["Be specific about correctable behaviors or outcomes.", "Solve problems rather than criticize.", "Express confidence in improvement.", "Give feedback both formally and informally."], "legacy": ["s44t1", "s44t2", "s44t3", "s44t4"], "example": false}, {"id": "feedback-followup", "refs": ["s45"], "ch": 12, "question": "What should managers recognize and agree on during feedback?", "answer": ["Praise specific high performance.", "Avoid personal criticism and treat the employee respectfully.", "Agree on a timetable for improvement."], "legacy": ["s45t1", "s45t2", "s45t3"], "example": false}]}</script><script>'use strict';

function review(){const cs=cards.filter(needsReview),missed=state.missed.map(id=>qmap[id]).filter(Boolean);return `<h1>Review again</h1><p class="muted">${cs.length} cards · ${missed.length} missed questions</p>${cs.length?'<button class="primary" data-action="reviewcards">Review these cards →</button>':empty('Nothing flagged','Mark cards “Review again” or complete a quiz.')}<div class="review-cards">${cs.map(c=>`<div class="listrow"><a href="#/flash/${c.id}">${esc(c.question)}</a><button class="small quiet" data-action="clearcard" data-id="${c.id}" aria-label="Clear review flag for ${esc(c.question)}">Clear</button></div>`).join('')}</div>${missed.length?'<div class="sectionhead"><h2>Missed questions</h2></div>':''}${missed.map(q=>`<details class="review-question"><summary>${esc(q.prompt)}</summary>${qExplanation(q,state.missedAnswers[q.id])}<button class="small" data-action="clearmissed" data-id="${q.id}">Mark reviewed</button></details>`).join('')}`}
function clearCard(c){delete state.cards[c.id];state.missed=state.missed.filter(id=>!c.legacy.includes(id)&&!(qmap[id]&&!terms.some(t=>t.id===id)&&c.refs.includes(qmap[id].sid)));for(const id of Object.keys(state.missedAnswers))if(!state.missed.includes(id))delete state.missedAnswers[id]}
function render(){let [view,p='',p2='']=location.hash.replace(/^#\/?/,'').split('/');view=view||'home';try{p=decodeURIComponent(p)}catch{}let html;switch(view){case 'home':html=home();break;case 'flash':if(p&&cardMap[p]){if(flashList[flashAt]?.id!==p){filter={ch:'all',status:'all',query:''};prepareFlash();flashAt=flashList.findIndex(c=>c.id===p);flashFace=false}}html=flash();break;case 'quiz':html=quizSetup(false,p==='topic'&&slideMap[p2]?p2:'');break;case 'final':html=quizSetup(true);break;case 'run':html=runQuiz();break;case 'results':html=results();break;case 'review':html=review();break;default:history.replaceState(null,'','#/home');html=home();view='home'}$('#main').innerHTML=html;document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===(view==='run'||view==='results'?(quiz?.mode==='final'?'final':'quiz'):view)));$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');updateStorage();if(quiz?.deadline&&!quiz.done)tick()}
function flashRefresh(){flashFace=false;renderFlash();if(flashList[flashAt]){try{history.replaceState(null,'','#/flash/'+flashList[flashAt].id)}catch{}}}
$('#main').addEventListener('click',e=>{if(e.target.closest('#flipCard')){flip();return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case 'shuffle':flashList=shuffle(flashList);flashAt=0;flashRefresh();break;case 'prevcard':moveCard(-1);break;case 'nextcard':moveCard(1);break;case 'mark':{const c=flashList[flashAt];if(!c)break;if(b.dataset.value==='know'){clearCard(c);state.cards[c.id]='know'}else state.cards[c.id]='review';save();toast(b.dataset.value==='know'?'Marked known':'Saved for review');if(filter.status!=='all'){prepareFlash()}else{flashAt=Math.min(flashAt+1,flashList.length-1);flashFace=false}renderFlash(true);break}case 'clearsearch':filter.query='';$('#search').value='';prepareFlash();flashRefresh();break;case 'reviewcards':filter={ch:'all',status:'review',query:''};prepareFlash();go('flash');break;case 'clearcard':clearCard(cardMap[b.dataset.id]);save();render();break;case 'clearmissed':state.missed=state.missed.filter(id=>id!==b.dataset.id);delete state.missedAnswers[b.dataset.id];save();render();break;case 'startquiz':startQuiz(b.dataset.mode,b.dataset.topic);break;case 'answer':quiz.answers[quiz.items[quiz.at].id]=Number(b.dataset.option);render();break;case 'qnext':quiz.at=Math.min(quiz.items.length-1,quiz.at+1);render();break;case 'qprev':quiz.at=Math.max(0,quiz.at-1);render();break;case 'qjump':quiz.at=Number(b.dataset.index);render();break;case 'submit':finishQuiz();break}});
$('#main').addEventListener('change',e=>{if(['flashCh','flashStatus'].includes(e.target.id)){filter.ch=$('#flashCh').value;filter.status=$('#flashStatus').value;prepareFlash();flashRefresh()}if(e.target.id==='useTimer')$('#minutes').disabled=!e.target.checked;if(e.target.id==='onlyMissed')document.querySelectorAll('.review-question').forEach(el=>el.hidden=e.target.checked&&el.dataset.right==='true')});
$('#searchform').addEventListener('submit',e=>{e.preventDefault();filter={ch:'all',status:'all',query:$('#search').value.trim()};prepareFlash();go('flash')});
$('#menu').addEventListener('click',()=>{const open=$('#rail').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))});
document.addEventListener('keydown',e=>{if(e.target.closest('#flipCard')&&(e.key==='Enter'||e.code==='Space')){e.preventDefault();flip();return}if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Escape'){$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){let buttons=[...document.querySelectorAll('.deck-nav button')],b=buttons[e.key==='ArrowRight'?buttons.length-1:0];if(b&&!b.disabled){e.preventDefault();b.click()}}});
$('.skip').addEventListener('click',e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView()});
addEventListener('hashchange',()=>{flashFace=false;if(location.hash==='#/flash'){prepareFlash();const pos=flashList.findIndex(c=>c.id===state.last);if(pos>=0)flashAt=pos}render();scrollTo(0,0);$('#main').focus({preventScroll:true})});
addEventListener('beforeunload',e=>{if(quiz&&!quiz.done){e.preventDefault();e.returnValue=''}});
prepareFlash();flashAt=Math.max(0,flashList.findIndex(c=>c.id===state.last));render();
</script></body></html>
